[project]
name = "codementor"
version = "0.1.0"
description = "CodeMentor — multi-agent tutoring backend (FastAPI + LangGraph)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "bcrypt>=4.0.1",
    "copilotkit>=0.1.66",
    "docling>=2.56.1",
    "ddgs>=9.15.0",
    "fastmcp>=0.1.0",
    "google-genai>=1.52.0",
    "google-generativeai>=0.8.5",
    "ipykernel>=7.1.0",
    "langchain>=1.2.18",
    "langchain-community>=0.4.1",
    "langchain-core>=1.4.0",
    "langchain-docling>=1.1.0",
    "langchain-mcp-adapters>=0.1.11",
    "langchain-openai>=1.2.1",
    "langchain-openrouter>=0.2.3",
    "langchain-qdrant>=1.1.0",
    "langchain-voyageai>=0.3.3",
    "langfuse>=3.0.0",
    "langgraph>=0.6.8",
    "langgraph-checkpoint-postgres>=3.0.5",
    "minio>=7.2.18",
    "numexpr>=2.14.1",
    "openai>=2.6.1",
    "paddleocr[all]>=3.3.1",
    "pdf2image>=1.17.0",
    "psycopg2-binary>=2.9.11",
    "python-dotenv>=1.0.1",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.9",
    "rateguard>=0.1.3",
    "redis>=7.4.0",
    "requests>=2.32.3",
    "ruff>=0.15.22",
    "scalar-fastapi>=1.8.2",
    "sqlmodel>=0.0.38",
    "structlog>=26.1.0",
    "tqdm>=4.67.1",
    "uvicorn>=0.34.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.15.22",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["notebooks", ".venv", "var"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency markers are meant to be evaluated in the default argument.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Form",
    "fastapi.File",
    "fastapi.Header",
    "fastapi.Body",
    "fastapi.Security",
]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: needs real LLM / MinIO / Postgres (see tests/README.md)",
    "e2e: needs the service running on :8686",
]
