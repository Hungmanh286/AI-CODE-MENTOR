x-common-build: &common-build
  image: codeMentor-backend
  build:
    context: ./
    dockerfile: Dockerfile

services:
  builder:
    <<: *common-build
    command: "echo 'Image built successfully'"
    profiles: ["builder"]

  codeMentor-ratelimit:
    image: redis:alpine
    container_name: mentorbot-ratelimit
    restart: unless-stopped
    ports:
      - "6380:6379"
    networks:
      - mentorbot-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  codeMentor-checkpointer:
    image: postgres:17-alpine
    container_name: mentorbot-checkpointer
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${CHECKPOINT_DB:-checkpointer}
      POSTGRES_USER: ${CHECKPOINT_USER:-edu}
      POSTGRES_PASSWORD: ${CHECKPOINT_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - checkpointer-data:/var/lib/postgresql/data
    networks:
      - mentorbot-net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${CHECKPOINT_USER:-edu} -d ${CHECKPOINT_DB:-checkpointer}",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
  codeMentor-app:
    image: postgres:17-alpine
    container_name: mentorbot-app
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${APP_DB:-mentorbot}
      POSTGRES_USER: ${APP_USER:-edu}
      POSTGRES_PASSWORD: ${APP_PASSWORD}
    ports:
      - "5435:5432"
    networks:
      - mentorbot-net
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${APP_USER:-edu} -d ${APP_DB:-mentorbot}"]
      interval: 10s
      timeout: 5s
      retries: 3

  codeMentor-minio:
    image: minio/minio:latest
    container_name: mentorbot-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin123
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    networks:
      - mentorbot-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

  codeMentor-qdrant:
    image: qdrant/qdrant:v1.18.3
    container_name: mentorbot-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__SERVICE__GRPC_PORT: 6334
    volumes:
      - qdrant-data:/qdrant/storage
    configs:
      - source: qdrant_config
        target: /qdrant/config/production.yaml
    networks:
      - mentorbot-net
    healthcheck:
      # The qdrant image ships no curl/wget/nc, so probe /healthz over bash's /dev/tcp.
      # Must be invoked through bash: /dev/tcp is a bash builtin and sh is dash here.
      test:
        [
          "CMD",
          "bash",
          "-c",
          "exec 3<>/dev/tcp/127.0.0.1/6333; printf 'GET /healthz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3; grep -q 'healthz check passed' <&3",
        ]
      interval: 10s
      timeout: 5s
      retries: 3

configs:
  qdrant_config:
    content: |
      log_level: INFO

volumes:
  checkpointer-data:
    driver: local
  minio-data:
    driver: local
  qdrant-data:
    driver: local

networks:
  wakabot-net:
    driver: bridge
  mentorbot-net:
    driver: bridge
