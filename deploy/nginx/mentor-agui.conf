# nginx in front of the Mentor Code backend (uvicorn on :8686).
# Include inside the `server { ... }` block that serves the API.
#
# POST /agent streams Server-Sent Events: nginx must not buffer or cut it,
# otherwise the answer shows up as one block at the end of a slow run.

location = /agent {
    proxy_pass http://127.0.0.1:8686;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_buffering off;          # also sent by the app as X-Accel-Buffering: no
    proxy_cache off;
    gzip off;                     # gzip would hold chunks back
    proxy_read_timeout 3600s;     # a quiz or mind map run can take minutes
    proxy_send_timeout 3600s;
    chunked_transfer_encoding on;
}

# History restore, login and the rest of the REST API: normal proxying.
location / {
    proxy_pass http://127.0.0.1:8686;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    client_max_body_size 100m;    # PDF uploads
}

# Legacy WebSocket chat (kept until the AG-UI flow is the only one).
location /chat/ {
    proxy_pass http://127.0.0.1:8686;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
}

# Several uvicorn workers are fine: checkpoints live in Postgres, not in memory.
